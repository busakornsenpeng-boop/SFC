name: Backup repair images to Google Drive

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 02:00 น. เวลาไทย ทุกวัน
  workflow_dispatch: {}     # กดรันมือได้จากแท็บ Actions — ใช้รอบแรกตอน backfill งานเก่าทั้งหมด

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run backup script
        run: node scripts/backupImagesToDrive.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DRIVE_BACKUP_FOLDER_ID: ${{ secrets.DRIVE_BACKUP_FOLDER_ID }}
